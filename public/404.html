<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickCare – Smart Hospital Queue Management System</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirect
      // https://github.com/rafgraph/spa-github-pages
      var isProjectPage = window.location.hostname.indexOf('github.io') > -1 && window.location.pathname.split('/').filter(Boolean).length > 0;
      var pathSegmentsToKeep = isProjectPage ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
