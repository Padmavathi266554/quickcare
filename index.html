<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickCare – Smart Hospital Queue Management System</title>
    <meta name="description" content="Smart hospital queue management system with real-time digital token tracking, doctor consultation management, and multi-role administrative dashboards." />
    <meta property="og:title" content="QuickCare – Smart Hospital Queue Management System" />
    <meta property="og:description" content="Smart hospital queue management system with real-time digital token tracking, doctor consultation management, and multi-role administrative dashboards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Synchronous Document Base Injector for GitHub Pages Subpath & Trailing-Slash Resolution -->
    <script type="text/javascript">
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          path = path + '/';
        } else if (path.includes('.')) {
          path = path.substring(0, path.lastIndexOf('/') + 1);
        }
        document.write('<base href="' + path + '">');
      })();
    </script>

    <!-- GitHub Pages Single Page Apps URL restoration (rafgraph/spa-github-pages) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- Diagnostic Error Trap to prevent silent blank white pages -->
    <script type="text/javascript">
      window.addEventListener('error', function(event) {
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          var failedSrc = event.target.src || event.target.href || 'asset';
          var rootEl = document.getElementById('root');
          if (rootEl && !window.__QUICKCARE_MOUNTED__) {
            rootEl.innerHTML = '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background-color: #F8FAFC; color: #0F172A; text-align: center;">' +
              '<div style="max-width: 540px; width: 100%; background: #FFFFFF; padding: 32px; border-radius: 20px; border: 1px solid #E2E8F0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);">' +
                '<div style="width: 52px; height: 52px; border-radius: 14px; background: #FEF3C7; color: #D97706; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 26px;">⚠️</div>' +
                '<h2 style="font-size: 19px; font-weight: 800; margin-bottom: 8px; color: #0F172A;">GitHub Pages Asset Load Notice</h2>' +
                '<p style="font-size: 14px; color: #64748B; line-height: 1.6; margin-bottom: 16px;">The browser could not load the asset from: <code style="background:#F1F5F9; padding:2px 6px; border-radius:6px; font-size:12px; color:#E11D48; word-break:break-all;">' + failedSrc + '</code></p>' +
                '<div style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; text-align: left; font-size: 13px; color: #334155; line-height: 1.7; margin-bottom: 16px;">' +
                  '<strong>Quick Fix in GitHub Settings:</strong><br/>' +
                  '1. Open your repository on GitHub &rarr; <strong>Settings</strong> &rarr; <strong>Pages</strong>.<br/>' +
                  '2. Under <strong>Build and deployment &rarr; Source</strong>, choose <strong>GitHub Actions</strong> (or select branch <code>main</code> and folder <strong>/docs</strong>).<br/>' +
                  '3. Push the latest build files and reload this page.' +
                '</div>' +
                '<button onclick="window.location.reload()" style="background:#059669; color:#fff; border:none; padding:10px 20px; border-radius:10px; font-weight:700; cursor:pointer;">Retry Loading</button>' +
              '</div>' +
            '</div>';
          }
        }
      }, true);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root">
      <!-- Branded fallback placeholder while React app loads -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F8FAFC; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #0F172A;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
          <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #059669, #0284C7); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.35);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
          <div>
            <div style="font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: #0F172A;">Quick<span style="color: #059669;">Care</span></div>
            <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #64748B;">Hospital Queue System</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #64748B;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #059669; transform: scale(1); animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
          <span>Loading hospital portal...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        function showNotice() {
          var rootEl = document.getElementById('root');
          if (rootEl && !window.__QUICKCARE_MOUNTED__) {
            rootEl.innerHTML = '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: system-ui, -apple-system, sans-serif; background-color: #F8FAFC; color: #1E293B; text-align: center;">' +
              '<div style="max-width: 520px; background: white; padding: 32px; border-radius: 20px; border: 1px solid #E2E8F0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);">' +
                '<div style="width: 52px; height: 52px; border-radius: 14px; background: #FEF3C7; color: #D97706; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 26px;">⚠️</div>' +
                '<h2 style="font-size: 19px; font-weight: 800; margin-bottom: 8px; color: #0F172A;">Action Required: Switch GitHub Pages Source</h2>' +
                '<p style="font-size: 14px; color: #64748B; line-height: 1.6; margin-bottom: 20px;">GitHub Pages is currently serving raw uncompiled TypeScript source files instead of the compiled production build.</p>' +
                '<div style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; text-align: left; font-size: 13px; color: #334155; line-height: 1.7; margin-bottom: 16px;">' +
                  '<strong>Quick Fix (Takes 30 seconds):</strong><br/>' +
                  '1. Open your repository on GitHub.<br/>' +
                  '2. Go to <strong>Settings</strong> &rarr; <strong>Pages</strong>.<br/>' +
                  '3. Under <strong>Build and deployment &rarr; Source</strong>, choose <strong>GitHub Actions</strong> (or set folder to <strong>/docs</strong>).<br/>' +
                  '4. Refresh this page once complete.' +
                '</div>' +
              '</div>' +
            '</div>';
          }
        }
        setTimeout(function() {
          if (!window.__QUICKCARE_MOUNTED__) {
            var rawScript = document.querySelector('script[src*="main.tsx"]');
            if (rawScript) showNotice();
          }
        }, 3500);
      })();
    </script>
  </body>
</html>
